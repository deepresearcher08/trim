[workspace]
resolver = "2"
members = [
    ".",
    "crates/llm-trim-core",
    "crates/llm-trim-rank",
    "crates/llm-trim-mcp",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
authors = ["Deep <deepresearcher08>"]

[package]
name = "llm-trim"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Zero-config semantic context minimizer: reduce a codebase to a high-density LLM prompt payload"
repository = "https://github.com/deepresearcher08/trim"
homepage = "https://github.com/deepresearcher08/trim"
documentation = "https://github.com/deepresearcher08/trim#readme"
readme = "README.md"
keywords = ["llm", "context", "prompt", "ast", "tree-sitter"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "trim"
path = "src/main.rs"

[dependencies]
llm-trim-core = { path = "crates/llm-trim-core", version = "0.3.0" }
llm-trim-rank = { path = "crates/llm-trim-rank", version = "0.3.0" }
clap = { version = "4", features = ["derive"] }
inquire = "0.7"
anyhow = "1"
env_logger = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
onnx = ["llm-trim-rank/onnx"]

[profile.release]
lto = true
opt-level = 3