[package]
name = "llm-trim-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tier 1 (Tree-Sitter parsing + skeletonization) and Tier 3 (budget engine) for llm-trim"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
ignore = "0.4"
log = "0.4"

tree-sitter = "0.20"
tree-sitter-rust = "0.20"
tree-sitter-python = "0.20"
tree-sitter-javascript = "0.20"
tree-sitter-typescript = "0.20"
tree-sitter-go = "0.20"

[dev-dependencies]
pretty_assertions = "1"