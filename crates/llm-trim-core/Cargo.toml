[package]
name = "llm-trim-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tier 1 (Tree-Sitter parsing + skeletonization) and Tier 3 (budget engine) for llm-trim"
repository = "https://github.com/deepresearcher08/trim"
homepage = "https://github.com/deepresearcher08/trim"
documentation = "https://github.com/deepresearcher08/trim#readme"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ignore = "0.4"
log = "0.4"
rayon = "1.10"

tree-sitter = "0.20"
tree-sitter-rust = "0.20"
tree-sitter-python = "0.20"
tree-sitter-javascript = "0.20"
tree-sitter-typescript = "0.20"
tree-sitter-go = "0.20"
tree-sitter-c = "0.20"
tree-sitter-cpp = "0.20"
tree-sitter-java = "0.20"
tree-sitter-c-sharp = "0.20"
tree-sitter-ruby = "0.20"
tree-sitter-php = "0.20"
toml = "0.8"
regex = "1.10"

[dev-dependencies]
pretty_assertions = "1"